version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly no --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-password} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc config host add minio http://minio:9000 $${MINIO_ROOT_USER:-admin} $${MINIO_ROOT_PASSWORD:-admin123}; do sleep 1; done;
      mc mb minio/sv-backups || true;
      mc policy set private minio/sv-backups;
      exit 0;
      "

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MIGRATOR_USER:-sv_migrator}:${POSTGRES_MIGRATOR_PASSWORD:-migpassword}@postgres:5432/${POSTGRES_DB:-sentinelvault}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    command: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-sv_app}:${POSTGRES_APP_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      - SMTP_SERVER=mailpit
      - SMTP_PORT=1025
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-sv_app}:${POSTGRES_APP_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: pnpm dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
